# Nginx Configuration for React Single Page Application
#
# This configures nginx to properly serve a React SPA:
# - Serves static files (HTML, CSS, JS, images)
# - Handles client-side routing (all routes → index.html)
# - Proxies API requests to backend
# - Enables compression for faster loading
#
# Author: Lashe Onamusi
# Date: December 2026

server {
    # Listen on port 80 (HTTP)
    listen 80;
    
    # Server name (use localhost for development)
    server_name localhost;
    
    # Root directory where files are served from
    root /usr/share/nginx/html;
    
    # Default file to serve
    index index.html;
    
    # Enable gzip compression (faster loading)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Serve static files with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # API proxy (forward API requests to backend)
    location /api {
        # Proxy to backend container
        # In docker-compose, use service name as hostname
        proxy_pass http://backend:5000;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # React Router - all routes serve index.html
    # This is critical for client-side routing!
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Custom error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
