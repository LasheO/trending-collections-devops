# Docker Compose Configuration
#
# This file defines how to run multiple Docker containers together.
# It orchestrates the frontend and backend services as a complete application.
#
# What is Docker Compose?
# - Tool for defining and running multi-container Docker applications
# - One command (docker-compose up) starts everything!
# - Containers can communicate with each other by service name
#
# Usage:
#   Start:   docker-compose up
#   Stop:    docker-compose down
#   Rebuild: docker-compose up --build
#
# Author: Lashe Onamusi
# Date: December 2026
# Purpose: University DevOps Assignment - Container Orchestration

version: '3.8'

# ==============================================================================
# SERVICES (CONTAINERS)
# ==============================================================================
services:
  
  # ----------------------------------------------------------------------------
  # Backend Service (Flask API)
  # ----------------------------------------------------------------------------
  backend:
    # Name shown in Docker Desktop
    container_name: trending-collections-backend
    
    # Build from Dockerfile in backend directory
    build:
      context: ./backend
      dockerfile: Dockerfile
    
    # Port mapping: host:container
    # Access backend at http://localhost:5000
    ports:
      - "5000:5000"
    
    # Environment variables
    environment:
      - FLASK_ENV=development
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - SQLALCHEMY_DATABASE_URI=sqlite:///app.db
    
    # Volumes: Sync code changes without rebuilding
    # Great for development! Edit code → changes reflected immediately
    volumes:
      - ./backend:/app
      - /app/venv_new  # Don't sync virtual environment
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Network (allows communication between containers)
    networks:
      - app-network
  
  # ----------------------------------------------------------------------------
  # Frontend Service (React + Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    # Name shown in Docker Desktop
    container_name: trending-collections-frontend
    
    # Build from Dockerfile in frontend directory
    build:
      context: ./frontend
      dockerfile: Dockerfile
    
    # Port mapping: host:container
    # Access frontend at http://localhost:3000
    ports:
      - "3000:80"
    
    # Depends on backend (start backend first)
    depends_on:
      - backend
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Network
    networks:
      - app-network

# ==============================================================================
# NETWORKS
# ==============================================================================
# Define a custom network so containers can communicate
networks:
  app-network:
    driver: bridge
    name: trending-collections-network

# ==============================================================================
# VOLUMES (OPTIONAL - FOR DATABASE PERSISTENCE)
# ==============================================================================
# If you want to persist database data between container restarts
volumes:
  db-data:
    name: trending-collections-db
